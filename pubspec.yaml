name: docuread
description: Open source document reader - PDF & DOCX viewer without ads
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # PDF handling
  syncfusion_flutter_pdfviewer: ^26.2.14
  
  # DOCX handling
  docx_to_text: ^0.1.4
  
  # File picker
  file_picker: ^8.1.2
  
  # Path handling
  path_provider: ^2.1.4
  path: ^1.9.0
  
  # Storage permissions
  permission_handler: ^11.3.1
  
  # State management
  provider: ^6.1.2
  
  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  
  # Search & highlight
  flutter_highlight: ^0.7.0
  
  # Shared preferences
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
